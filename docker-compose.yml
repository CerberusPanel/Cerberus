services:
  cerberus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    group_add:
      - "983"
    working_dir: /app/backend
    network_mode: host
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      - HOST_OS_RELEASE_PATH=/host/etc/os-release
      - APP_STORE_REPOSITORY_URL=https://github.com/CerberusPanel/AppStore
      - APP_STORE_REPOSITORY_BRANCH=${APP_STORE_REPOSITORY_BRANCH:-Development}
      - AUTH_TOKEN_TTL_SECONDS=28800
      - MASTER_USERNAME=${MASTER_USERNAME:-admin}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-change-me}
      - MASTER_DISPLAY_NAME=${MASTER_DISPLAY_NAME:-Master Admin}
    command: >-
      sh -c 'if [ -r /host/etc/os-release ]; then . /host/etc/os-release; elif [ -r /host/usr/lib/os-release ]; then . /host/usr/lib/os-release; fi;
      export HOST_OS_NAME_OVERRIDE="$${PRETTY_NAME:-$${NAME:-}}";
      npm install && npm run start'

  cerberus-frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_WS_URL=/ws
      - VITE_API_PROXY_TARGET=http://host.docker.internal:3000
      - VITE_WS_PROXY_TARGET=ws://host.docker.internal:3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
